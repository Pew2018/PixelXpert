name: Pixel Clone Profile Helper
on:
  push:
    branches: [main]
    paths: ['cloneprofile/**', 'settings.gradle.kts', '.github/workflows/cloneProfileHelper.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android 17 preview SDK platform
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - run: chmod +x gradlew
      - name: Build and verify only the standalone module
        run: ./gradlew :cloneprofile:lintDebug :cloneprofile:testDebugUnitTest :cloneprofile:assembleDebug :cloneprofile:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-clone-profile-helper-1.0.0-main
          path: |
            cloneprofile/build/outputs/apk/debug/*.apk
            cloneprofile/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
